<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover">

  <!-- Replace with your own title and description. -->
  <title>Awesome Docsify Site</title>
  <meta name="description" content="An awesome docsify site for publishing some content on the web.">

  <!-- Default Theme (see https://docsify.js.org/#/themes) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

</head>

<body>
  <div id="app"></div>

  <script>
    // Docsify Configuration (see https://docsify.js.org/#/configuration)
window.$docsify = {
  name: 'Min Læringsplattform',
  loadSidebar: true,
  alias: {
    '/sti-nybegynner/_sidebar.md': '/sti-nybegynner/_sidebar.md',
    '/sti-viderekommen/_sidebar.md': '/sti-viderekommen/_sidebar.md',
    '/sti-ekspert/_sidebar.md': '/sti-ekspert/_sidebar.md',
    '/.*/_sidebar.md': '/_sidebar.md'
  },
  search: {
    paths: 'auto',
    placeholder: 'Søk på tvers av alle læringsstier...'
  },
  
    plugins: [
    function(hook, vm) {
      hook.beforeEach(function(html) {
        // Hent den gjeldende filstien brukeren ser på
        var currentPath = vm.route.path;
        var bannerHtml = '';

        // Definer designet og teksten for de tre ulike bannerne
        if (currentPath.includes('/sti-nybegynner/')) {
          bannerHtml = `
            <div style="background-color: #e6f4ea; color: #137333; border: 1px solid #137333; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-weight: bold; display: flex; align-items: center;">
              🟢 Du følger nå: NYBEGYNNER-STIEN
            </div>`;
        } else if (currentPath.includes('/sti-viderekommen/')) {
          bannerHtml = `
            <div style="background-color: #e8f0fe; color: #1a73e8; border: 1px solid #1a73e8; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-weight: bold; display: flex; align-items: center;">
              🔵 Du følger nå: VIDEREKOMMEN-STIEN
            </div>`;
        } else if (currentPath.includes('/sti-ekspert/')) {
          bannerHtml = `
            <div style="background-color: #f3e8fd; color: #9333ea; border: 1px solid #9333ea; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-weight: bold; display: flex; align-items: center;">
              🟣 Du følger nå: EKSPERT-STIEN
            </div>`;
        }

        // Legg banneret helt øverst i Markdown-innholdet [st2]
        return bannerHtml + html;
      });
    }
  ]
};
  
  
  </script>

  <!-- Required -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Recommended -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

</body>
</html>

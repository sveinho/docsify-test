<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Support kit</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Support kit with three distinct paths">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Official Docsify Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <!-- Customized CSS for the three paths (Badges) -->
  <style>
    .badge {
      display: inline-block;
      padding: 0.25em 0.6em;
      font-size: 75%;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      vertical-align: baseline;
      border-radius: 0.25rem;
      color: #fff;
      margin-right: 5px;
    }
    /* Color codes for the new tracks */
    .track-researcher { background-color: #2b7de9; } /* Blue */
    .track-manager { background-color: #28a745; }    /* Green */
    .track-trainer { background-color: #dc3545; }    /* Red */
  </style>
</head>
<body>
  <div id="app">Loading learning materials...</div>
  
  <script>
    window.$docsify = {
      name: 'Support kit',
      repo: '', 
      
      // Sidebar, navbar, and homepage configuration
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 2,
      homepage: 'home.md', // We will translate the content of this file next

      // Route the user to the correct sidebar based on the track folder
      alias: {
        '/track-researcher/(.*)': '/track-researcher/_sidebar.md',
        '/track-manager/(.*)': '/track-manager/_sidebar.md',
        '/track-trainer/(.*)': '/track-trainer/_sidebar.md'
      },

      // Tabs plugin configuration
      tabs: {
        persist: true,
        sync: true,
        theme: 'classic',
        tabComments: true,
        tabHeadings: true
      }
    }
  </script>

  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Plugin: Search Feature -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

  <!-- Plugin: docsify-tabs -->
  <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
</body>
</html>

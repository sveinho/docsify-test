<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Læringsportal</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Læringsmateriale med tre spor">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Offisielt Docsify-tema -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <!-- Skreddersydd CSS for dine tre læringsløp-tagger (Badges) -->
  <style>
    .badge {
      display: inline-block;
      padding: 0.25em 0.6em;
      font-size: 75%;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      vertical-align: baseline;
      border-radius: 0.25rem;
      color: #fff;
      margin-right: 5px;
    }
    /* Fargekoder for de tre læringsløpene */
    .spor-intro { background-color: #2b7de9; } /* Blå */
    .spor-utvikler { background-color: #28a745; } /* Grønn */
    .spor-arkitekt { background-color: #dc3545; } /* Rød */
  </style>
</head>
<body>
  <div id="app">Laster læringsmateriale...</div>
  
  <script>
    window.$docsify = {
      name: 'Læringsportal',
      repo: '', // Legg til lenke til ditt GitHub-repo her om ønskelig
      
      // Aktiverer sideoversikt og toppmeny
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 2,

      // Ruter brukeren til riktig sidebar basert på hvilket spor de klikker på
      alias: {
        '/spor-intro/.+': '/spor-intro/_sidebar.md',
        '/spor-utvikler/.+': '/spor-utvikler/_sidebar.md',
        '/spor-arkitekt/.+': '/spor-arkitekt/_sidebar.md'
      },

      // Innstillinger for fane-plugin (tabs)
      tabs: {
        persist: true,
        sync: true,
        theme: 'classic',
        tabComments: true,
        tabHeadings: true
      }
    }
  </script>

  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Plugin: Søkefunksjon (Valgfritt, men veldig nyttig) -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

  <!-- Plugin: docsify-tabs (For å splitte innhold i faner per spor) -->
  <script src="https://jsdelivr.net"></script>
</body>
</html>

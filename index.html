<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Min Læringsplattform</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Tre unike læringsstier i én plattform">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Docsify standard designtema -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">Laster dokumentasjon...</div>
  
  <script>
    window.$docsify = {
      name: 'Læringsplattform',
      repo: '',
      
      // 1. Sidemeny-konfigurasjon [st1]
      loadSidebar: true,
      alias: {
        '/sti-nybegynner/_sidebar.md': '/sti-nybegynner/_sidebar.md',
        '/sti-viderekommen/_sidebar.md': '/sti-viderekommen/_sidebar.md',
        '/sti-ekspert/_sidebar.md': '/sti-ekspert/_sidebar.md',
        '/.*/_sidebar.md': '/_sidebar.md' // Fallback til global meny
      },

      // 2. Den komplette søkefunksjonen
   search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Søk på tvers av alle tre læringsstier...',
        noData: 'Ingen resultater funnet for dette søket!',
        depth: 6, 
        hideOtherSidebarContent: false, 
        namespace: 'learning-paths'
      },

 
  </script>

  <!-- Kjerne-skriptet til Docsify -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- Det offisielle søke-skriptet (MÅ ligge under Docsify-kjernen) -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>

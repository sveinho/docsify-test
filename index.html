<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover">

  <!-- Replace with your own title and description. -->
  <title>Awesome Docsify Site</title>
  <meta name="description" content="An awesome docsify site for publishing some content on the web.">

  <!-- Default Theme (see https://docsify.js.org/#/themes) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

</head>

<body>
  <div id="app"></div>

  <script>
    // Docsify Configuration (see https://docsify.js.org/#/configuration)
window.$docsify = {
  name: 'Min Læringsplattform',
  repo: '',
  
  // 1. Aktiver sidemeny
  loadSidebar: true,
  
  // 2. Bytt sidemeny dynamisk basert på mappen brukeren er i
  alias: {
    '/sti-nybegynner/_sidebar.md': '/sti-nybegynner/_sidebar.md',
    '/sti-viderekommen/_sidebar.md': '/sti-viderekommen/_sidebar.md',
    '/sti-ekspert/_sidebar.md': '/sti-ekspert/_sidebar.md',
    '/.*/_sidebar.md': '/_sidebar.md' // Fallback til global meny på rot
  },

  // 3. Konfigurer det globale søket
  search: {
    maxAge: 86400000, // Cache i ett døgn
    paths: 'auto',    // Går automatisk gjennom alle tilgjengelige sider
    placeholder: 'Søk på tvers av alle læringsstier...',
    noData: 'Ingen resultater funnet!',
    depth: 6,         // Hvor dypt i overskriftene søket skal lete
    
    // Gjør det tydelig i søkeresultatet hvilken sti dokumentet tilhører
    namespace: 'learning-paths' 
  }
};
  </script>

  <!-- Required -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Recommended -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js"></script>

</body>
</html>
